worker_processes auto;

# 加载 TCP Stream 模块
# 注意：官方 nginx:1.24 镜像默认包含了此模块，若报错可取消下一行的注释
# load_module modules/ngx_stream_module.so;

events {
    worker_connections 1024;
}

# ==================== HTTP 代理 ====================
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile n;
    keepalive_timeout 65;

    client_max_body_size 2g;

    # 80 端口强制跳转 HTTPS
    server {
        listen 80;
        server_name _; 
        return 301 https://$host$request_uri;
    }

    # 443 端口 HTTPS 代理
    server {
        listen 443 ssl;
        server_name _;

        # 证书路径（与 docker-compose.yml 的挂载路径对应）
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # 1. 处理 /chat/（下载和预览） -> 转发给 MinIO 容器
        location /chat/ {
            proxy_pass http://minio:9000/chat/;
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            client_max_body_size 2g;
        }

        # 2. 处理 /upload/（上传） -> 转发给 ChatServer 的 UploadWorker
        location /upload/ {
            proxy_pass http://chatserver:9003/upload/;
            proxy_set_header Host $host;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 2g;
        }
        
        # 3. 动态配置下发（如果没有可以用 Nginx 直接返回，或者由 ChatServer 处理）
        location = /config {
            default_type application/json;
            # 这里让用户填写他自己的公网 IP 或域名
            return 200 '{"serverHost": "<你的公网IP或域名>", "tcpPort": 9443, "useHttps": true}';
        }
    }
}

# ==================== Stream TCP 代理 ====================
stream {
    # 9443 端口：客户端的 TLS 加密长连接
    server {
        listen 9443 ssl;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # 解密后，转发给 ChatServer 容器的 9002 明文端口
        proxy_pass chatserver:9002;
    }
}
