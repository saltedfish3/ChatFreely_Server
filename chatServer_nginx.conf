# ========== ChatServer Nginx 配置模板 ==========
# 使用步骤：
#   1. 替换 <YOUR_DOMAIN>（如 chat.example.com）
#   2. 替换 <YOUR_STORAGE_HOST>（如 xxx.cos.ap-guangzhou.myqcloud.com）
#   3. 证书放到 /etc/nginx/ssl/，或改下面的路径
#   4. 放到 /etc/nginx/conf.d/chatserver.conf
#      nginx -t && systemctl reload nginx

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---------- 1. 文件下载 / 预览 ----------
    # 走对象存储（COS / OSS / S3 / MinIO 均可，只改 host）
    location /chat/ {
        proxy_pass https://<YOUR_STORAGE_HOST>/;
        proxy_ssl_server_name on;
        proxy_set_header Host <YOUR_STORAGE_HOST>;

        # 去掉对象存储的强制下载响应头，否则视频/图片无法内联预览
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-cos-force-download;

        # Range 透传：视频拖动进度、断点续传依赖这两行
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # ---------- 2. 上传 ----------
    location /upload/ {
        proxy_pass http://127.0.0.1:9003/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 大文件直接透传，不落 nginx 临时盘
        proxy_read_timeout 300s;
        client_max_body_size 2g;
    }

    # ---------- 3. 客户端配置下发 ----------
    location = /config {
        default_type application/json;
        return 200 '{"serverHost":"<YOUR_DOMAIN>","tcpPort":"9443","useHttps":true}';
    }
}
