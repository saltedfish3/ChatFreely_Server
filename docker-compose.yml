version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chatserver-mysql
    environment:
      MYSQL_ROOT_PASSWORD: <你的Root密码>
      MYSQL_DATABASE: ChatFreely
      MYSQL_USER: ChatFreely
      MYSQL_PASSWORD: <你的数据库密码>
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - chat-network

  redis:
    image: redis:7.2-alpine
    container_name: chatserver-redis
    command: redis-server --requirepass "<你的Redis密码>"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - chat-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: chatserver-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: <你的MinIO账号>
      MINIO_ROOT_PASSWORD: <你的MinIO密码>
      MINIO_SERVER_URL: "https://<你的公网IP或域名>" 
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data 
    restart: unless-stopped
    networks:
      - chat-network

  chatserver:
    build: . 
    container_name: chatserver-core
    depends_on:
      - mysql
      - redis
      - minio
    ports:
      - "9002:9002"
      - "9003:9003"
    volumes:
      - ./config:/app/config
      - ./secret:/app/secret
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - chat-network

  nginx:
    image: nginx:1.24
    container_name: chatserver-nginx
    depends_on:
      - chatserver
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro 
    restart: unless-stopped
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
